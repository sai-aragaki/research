/* THEMES:CSS:START */
/* =========================================================
   DESIGN THEMES — 共有テーマ定義（正本）
   このファイルを直接編集し、sync-themes.py で各ページに流し込む。
   ページ側のHTMLを手で書き換えないこと。
   ========================================================= */

/* --- 既定テーマ（sai）: ページ側のパレットに足りないトークンを補う --- */
:root {
  /* 形 */
  --r-card: 0px;        /* カード・パネルの角丸 */
  --r-pill: 48px;       /* チップ・タグ・ピルボタン */
  --r-input: 4px;       /* 入力欄 */
  --r-xs: 3px;          /* トースト等の極小要素 */
  --r-inner: 12px;      /* 吹き出し・入れ子カード */
  --r-band-card: 16px;  /* 一段大きいカード */
  --bw: 1px;            /* カードの枠線幅 */
  --r-scale: 1;         /* 角丸の倍率。値が散っているページ（research-sai）はこれで一括調整する */
  /* ページによって罫線トークンの名前が違う（sai-works系は --rule、research系は --line）。
     var() のフォールバックで両方に対応する。 */
  --card-line: var(--rule, var(--line));
  --input-line: var(--rule-strong, var(--line-strong));

  /* ページごとに既定が違うトークン（--paper-rgb / --ls-display）は
     ここに書かない。各ページの :root で定義し、テーマ側は
     html[data-theme="..."] ブロックでだけ上書きする。 */

  /* 文字 */
  --fw-display: 300;         /* 大見出しのウェイト */
  --ls-label: 0.14em;        /* 欧文ラベルの字間 */
  --label-case: uppercase;   /* 欧文ラベルの大文字化 */
  --lh-body: 1.9;            /* 本文の行間 */

  /* 影（既定は使わない。浮かせるテーマ用の受け口） */
  --shadow-card: none;
  --shadow-pop: none;

  /* アイコン（線画SVGの線の太さ） */
  --ico-sw: 1.5;
  --ico-sw-lg: 1.25;

  /* 装飾 */
  --caution: #c84e6c;                    /* 注意書きのラベル */
  --track-bg: #dde5e1;                   /* バーの溝 */
  --track-bg-soft: #eef1ef;              /* バーの溝（淡い方） */
  --lang-en-bg: #eef1f5;                 /* 言語バッジ（EN） */
  --lang-en-fg: #5a6b86;
  --mark-bg: rgba(98, 184, 160, .34);    /* マーカー線（標準） */
  --mark-c-bg: rgba(235, 101, 132, .28); /* マーカー線（強調） */
  --accent-band: var(--stripe);
  --footer-bg: var(--rule);
  --footer-fg: var(--muted);
  --chip-g-bg: rgba(98, 184, 160, .14);
  --chip-b-bg: rgba(79, 124, 135, .14);
  --mosaic: #62B8A0, #F2C94C, #EB6584, #4F7C87, #FFFFFF, #FFFFFF, #F5F5F5;
  /* 記事ページの節の交互の帯 */
  --sec-bg: var(--white);                /* 奇数番目の節の背景 */
  --sec-alt-bg: #F6F6F6;                 /* 偶数番目の節の背景（薄いテーマカラー） */
  --sec-pad-y: 48px;                     /* main 直下の節の上下余白 */
  --bleed: 100vw;                        /* 画面幅いっぱいに広げるときの幅（帯・ストライプ） */
  --hero-pb: 56px;                       /* ヘッダー（hero）の下余白。ストライプはこの下、節との境目に置く */
  --stripe-h: 4px;                       /* ヘッダー下のストライプの太さ */
}

/* --- theme: bold（黒と黄・2pxの枠線・影なし）--- */
html[data-theme="bold"] {
  --paper: #FAF9EC;
  --paper-rgb: 250, 249, 236;
  --white: #FFFFFF;
  --ink: #1B1B1B;
  --text: #1B1B1B;
  --muted: #6E6B5E;
  --rule: #E4E2D2;
  --rule-strong: #1B1B1B;
  --tint: #F2F1E2;
  --teal: #1B1B1B;      /* 文字にも背景にも使われるため黒。黄色は --teal-wash 側 */
  --teal-deep: #1B1B1B;
  --coral: #6E6A12;     /* 強調テキスト。紙の上で 5.3:1 */
  --yellow: #E3E143;
  --deep-teal: #1B1B1B;
  --deep: #1B1B1B;
  --en: "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif;
  --stripe: repeating-linear-gradient(135deg, #E3E143 0 16px, #1B1B1B 16px 18px, #E3E143 18px 34px);

  --r-card: 12px;
  --r-pill: 999px;
  --r-input: 12px;
  --r-xs: 999px;
  --r-inner: 12px;
  --r-band-card: 12px;
  --bw: 2px;
  --r-scale: 1;
  --card-line: var(--ink);
  --input-line: var(--ink);

  --fw-display: 700;
  --ls-display: 0;
  --ls-label: 0.08em;
  --label-case: uppercase;
  --lh-body: 1.8;

  --shadow-card: none;
  --shadow-pop: none;

  --ico-sw: 2;
  --ico-sw-lg: 2;

  /* research-sai 系のトークン名（記事ページはこちらの語彙を使う）
     --teal は文字色にも背景にも使われるので黒に寄せ、
     背景専用の --teal-wash に黄色を置く。 */
  --panel: #F3F1DF;
  --paper-2: #F3F1DF;
  --ink-soft: #1B1B1B;
  --ink-faint: #6E6B5E;
  --teal-wash: #E3E143;
  --coral-wash: #F6F4C4;
  --sand: #6E6A12;
  --sand-wash: #F6F4C4;
  --line: #E0DECB;
  --line-soft: #EDEBD9;
  --line-strong: #1B1B1B;
  --paper-warm: #F3F1DF;
  --card: #FFFFFF;
  --shadow: none;

  --caution: #9B2C2C;
  --track-bg: #E0DECB;
  --track-bg-soft: #EDEBD9;
  /* 淡い面の上に置く濃い文字色。既定は各ページの :root にある */
  --teal-ink: #1B1B1B;
  --sand-ink: #6E6A12;
  --sand-ink-soft: #6E6A12;
  --coral-ink: #9B2C2C;
  --pull-ink: #1B1B1B;
  --lang-en-bg: #F0EFE2;
  --lang-en-fg: #5B5848;
  /* 半透明の下地（alpha はページ側に残し、RGBだけ差し替える） */
  --teal-rgb: 227, 225, 67;
  --coral-rgb: 110, 106, 18;
  --yellow-rgb: 227, 225, 67;
  --deep-rgb: 27, 27, 27;
  --mark-bg: rgba(227, 225, 67, .60);
  --mark-c-bg: rgba(110, 106, 18, .20);
  --accent-band: #E3E143;
  --footer-bg: #E3E143;
  --footer-fg: #1B1B1B;
  --chip-g-bg: rgba(227, 225, 67, .34);
  --chip-b-bg: rgba(27, 27, 27, .08);
  --mosaic: #E3E143, #1B1B1B, #F9F8D9, #FFFFFF, #FFFFFF, #F2F1E2, #E3E143;
  --sec-alt-bg: #F9F8DE;
}

/* --- 記事ページ：節ごとに背景を交互に変える（全テーマ共通） ---
   奇数番目の節は白、偶数番目は薄いテーマカラー（--sec-alt-bg）。
   帯は画面幅いっぱいに広げる（box-shadow + clip-path で左右だけ伸ばす）。
   節は body 直下のページと main 直下のページがある。 */
/* 対象は research の記事ページ（ナビに .nav-inner / .gnav-inner がある）だけ。
   sai-works・LP・デザインシステムのページには効かせない。 */
body:has(.nav-inner, .gnav-inner) { overflow-x: clip; }
body:has(.nav-inner, .gnav-inner) > section,
body:has(.nav-inner, .gnav-inner) > main > section { background: var(--sec-bg); box-shadow: 0 0 0 var(--bleed) var(--sec-bg); clip-path: inset(0 calc(var(--bleed) * -1)); }
body:has(.nav-inner, .gnav-inner) > section:nth-of-type(even),
body:has(.nav-inner, .gnav-inner) > main > section:nth-of-type(even) { background: var(--sec-alt-bg); box-shadow: 0 0 0 var(--bleed) var(--sec-alt-bg); }
body:has(.nav-inner, .gnav-inner) > main > section[id^="sec-"] { padding-top: var(--sec-pad-y); padding-bottom: var(--sec-pad-y); }
/* 最後の節とフッターの間に紙の色の隙間を作らない */
body:has(.nav-inner, .gnav-inner) section ~ footer,
body:has(.nav-inner, .gnav-inner) main ~ footer { margin-top: 0 !important; }

/* ヘッダー下のストライプは、帯の境目（最初の節の上端）に描く。
   ページごとに hero の中の位置（.hero::after / .hero .wrap::after）と余白が違い、
   帯の端とずれていたので、hero 側のストライプは消して節の ::before に一本化する。
   hero の下余白は --hero-pb に揃え、hero の下罫線はストライプが代わりをするので消す。 */
body:has(.nav-inner, .gnav-inner) .hero { padding-bottom: var(--hero-pb) !important; border-bottom-width: 0 !important; }
body:has(.nav-inner, .gnav-inner) .hero::after,
body:has(.nav-inner, .gnav-inner) .hero .wrap::after { display: none !important; }
body:has(.nav-inner, .gnav-inner) > section:first-of-type,
body:has(.nav-inner, .gnav-inner) > main > section:first-of-type { position: relative; }
body:has(.nav-inner, .gnav-inner) > section:first-of-type::before,
body:has(.nav-inner, .gnav-inner) > main > section:first-of-type::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: var(--stripe-h); background: var(--stripe); z-index: 1; }

/* =========================================================
   切り替えボタン（.ts- 接頭辞。ページ側のCSSと衝突させない）
   ページ側は <div data-theme-switch></div> を1つ置くだけ。
   ========================================================= */

[data-theme-switch] { position: relative; flex: none; line-height: 0; }

/* ヘッダーの無いページ用：右上に浮かせる */
[data-theme-switch][data-ts-float] { position: fixed; top: 16px; right: 16px; z-index: 300; }
[data-theme-switch][data-ts-float] .ts-btn { background: var(--white); }

.ts-btn {
  appearance: none;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 36px;
  height: 36px;
  padding: 0;
  border: var(--bw) solid var(--ink);
  border-radius: var(--r-pill);
  background: transparent;
  color: var(--ink);
  cursor: pointer;
  transition: background .18s, color .18s, border-color .18s;
}

.ts-btn:hover { background: var(--ink); color: var(--white); }
.ts-btn:focus-visible { outline: 1px solid var(--ink); outline-offset: 2px; }

.ts-btn svg {
  width: 20px;
  height: 20px;
  fill: none;
  stroke: currentColor;
  stroke-width: var(--ico-sw);
  stroke-linecap: round;
  stroke-linejoin: round;
}

.ts-btn svg circle[data-dot] { fill: currentColor; stroke: none; }

.ts-menu {
  position: absolute;
  top: calc(100% + 10px);
  right: 0;
  min-width: 290px;
  background: var(--white);
  border: var(--bw) solid var(--ink);
  border-radius: var(--r-card);
  box-shadow: var(--shadow-pop);
  padding: 6px;
  line-height: 1.5;
  z-index: 200;
}

.ts-menu[hidden] { display: none; }

.ts-opt {
  appearance: none;
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  text-align: left;
  border: 0;
  background: transparent;
  color: var(--ink);
  padding: 9px 10px;
  border-radius: var(--r-card);
  cursor: pointer;
  font-family: inherit;
  transition: background .18s;
}

.ts-opt:hover { background: var(--tint); }
.ts-opt:focus-visible { outline: 1px solid var(--ink); outline-offset: -1px; }
.ts-dots { display: flex; gap: 3px; flex: none; }
.ts-dots i { display: block; width: 8px; height: 8px; border-radius: 50%; border: 1px solid var(--rule-strong); box-sizing: border-box; }
.ts-text { flex: 1; min-width: 0; }
.ts-name { font-family: var(--en); font-size: 12px; font-weight: 500; letter-spacing: .04em; }
.ts-desc { display: block; font-size: 11px; color: var(--muted); line-height: 1.5; margin-top: 1px; }
.ts-check { margin-left: auto; flex: none; font-size: 11px; color: var(--ink); opacity: 0; }
.ts-opt[aria-selected="true"] .ts-check { opacity: 1; }

/* research-sai の細いナビの中では一回り小さく */
.nav-inner > [data-theme-switch] .ts-btn,
.gnav-inner > [data-theme-switch] .ts-btn { width: 28px; height: 28px; }
.nav-inner > [data-theme-switch] .ts-btn svg,
.gnav-inner > [data-theme-switch] .ts-btn svg { width: 16px; height: 16px; }

@media (max-width: 768px) {
  .ts-btn { width: 32px; height: 32px; }
  .ts-btn svg { width: 18px; height: 18px; }
  .ts-menu { min-width: 264px; }
}
/* THEMES:CSS:END */
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--paper);color:var(--ink);
    font-family:"Noto Sans JP",sans-serif;font-weight:400;line-height:1.85;font-size:15px;
    -webkit-font-smoothing:antialiased;letter-spacing:.01em;height:100vh;overflow:hidden}
  a{text-decoration:none;color:inherit}
  ::selection{background:var(--coral);color:var(--white)}
  button{font-family:inherit;border:none;background:none;cursor:pointer}

  /* ======== DESKTOP SHELL ======== */
  .shell{display:grid;grid-template-columns:var(--sidebar-w) 1fr;height:100vh}

  /* ---- left column ---- */
  .left{display:flex;flex-direction:column;height:100vh;border-right:1px solid var(--line);overflow:hidden}
  .left-head{flex-shrink:0;padding:20px 20px 0;position:relative}
  .left-head [data-theme-switch]{position:absolute;top:30px;right:26px}
  .eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.18em;color:var(--teal-deep);text-transform:uppercase;margin:0 0 16px;display:flex;align-items:center}
  .eyebrow::before{content:"";display:inline-block;width:22px;height:2px;background:var(--teal);margin-right:10px}
  .last-updated{font-size:11.5px;color:var(--muted);letter-spacing:.03em;margin-top:6px}
  .last-updated b{font-weight:600;color:var(--ink-soft)}

  .toolbar{flex-shrink:0;padding:0 20px 14px;border-bottom:1px solid var(--line);background:var(--paper)}
  .search{position:relative;margin:0 0 12px}
  .search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--muted);pointer-events:none}
  .search input{
    width:100%;font-family:"Noto Sans JP",sans-serif;font-size:13.5px;color:var(--ink);
    padding:10px 14px 10px 38px;border:var(--bw) solid var(--input-line);border-radius:calc(10px * var(--r-scale));
    background:var(--white);outline:none;transition:border-color .2s,box-shadow .2s}
  .search input::placeholder{color:var(--muted)}
  .search input:focus{border-color:var(--teal);box-shadow: none}
  .filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .chip{font-size:12px;font-weight:500;letter-spacing:.02em;
    padding:5px 12px;border-radius:calc(999px * var(--r-scale));border:var(--bw) solid var(--card-line);background:var(--white);color:var(--ink-soft);
    cursor:pointer;white-space:nowrap;transition:all .2s ease}
  .chip:hover{border-color:var(--teal);color:var(--teal-deep)}
  .chip.active{background:var(--ink);border-color:var(--ink);color:var(--white)}
  .chip.flag-chip{border-color:var(--coral);color:var(--coral)}
  .chip.flag-chip:hover{background:var(--coral-wash)}
  .chip.flag-chip.active{background:var(--coral);border-color:var(--coral);color:var(--white)}
  .chip .c{font-size:10px;opacity:.6;margin-left:4px;font-feature-settings:"tnum"}

  .count{font-size:11.5px;letter-spacing:.04em;color:var(--muted);padding:12px 20px 4px;flex-shrink:0}
  .list{flex:1;overflow-y:auto;padding:0 0 40px;-webkit-overflow-scrolling:touch}

  /* ---- entry ---- */
  .entry{position:relative;padding:14px 20px;border-bottom:1px solid var(--line);
    cursor:pointer;transition:background .2s ease}
  .entry:hover{background:var(--panel)}
  .entry.is-active{background:var(--teal-wash)}
  .entry.is-active .t{color:var(--teal-deep)}

  .cat{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--coral);margin:0 0 3px}
  .t{font-family:"Noto Sans JP",serif;font-weight:700;font-size:15px;line-height:1.45;margin:0 0 2px;padding-right:30px;transition:color .2s ease}
  .s{font-size:12px;color:var(--muted);line-height:1.6;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  mark{background:var(--teal-wash);color:var(--teal-deep);font-weight:700;border-radius:calc(2px * var(--r-scale));padding:0 1px}

  /* bookmark icon: top-right of entry */
  .bm{position:absolute;top:12px;right:16px;width:28px;height:28px;
    display:flex;align-items:center;justify-content:center;
    border-radius:calc(6px * var(--r-scale));color:var(--line-strong);transition:color .15s,background .15s;z-index:2}
  .bm:hover{color:var(--coral);background:var(--coral-wash)}
  .bm.on{color:var(--coral)}
  .bm svg{width:16px;height:16px}

  .empty-msg{display:none;padding:40px 20px;text-align:center;color:var(--muted);font-size:13px}

  /* ---- right column (reader) ---- */
  .right{display:flex;flex-direction:column;height:100vh;background:var(--white);position:relative}
  .reader-bar{flex-shrink:0;display:flex;align-items:center;gap:12px;padding:10px 20px;
    border-bottom:1px solid var(--line);background:var(--paper);min-height:46px}
  .reader-title{font-family:"Noto Sans JP",serif;font-size:13px;font-weight:600;color:var(--ink-soft);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
  .reader-link{font-size:12px;font-weight:500;color:var(--teal-deep);padding:5px 12px;
    border:1px solid var(--teal);border-radius:calc(8px * var(--r-scale));white-space:nowrap;transition:all .15s;flex-shrink:0}
  .reader-link:hover{background:var(--teal-deep);color:var(--white)}
  .reader-frame{flex:1;border:none;width:100%;height:100%}
  .reader-empty{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;color:var(--muted)}
  .reader-empty svg{width:48px;height:48px;color:var(--line-strong)}
  .reader-empty span{max-width:240px;text-align:center;line-height:1.7;font-size:13px}

  /* ---- mobile back bar (hidden by default, shown only when reader is open) ---- */
  .mob-back{display:none}

  /* ---- animation ---- */
  .fade{opacity:0;transform:translateY(8px);animation:fin .45s ease forwards}
  @keyframes fin{to{opacity:1;transform:none}}

  /* ======== MOBILE ======== */
  @media(max-width:860px){
    .shell{grid-template-columns:1fr}
    .left{height:100vh;overflow-y:auto}
    .left-head{padding:16px 16px 0}
    .toolbar{padding:0 16px 12px}
    .count{padding:8px 16px 4px}
    .list{overflow:visible;padding-bottom:140px}
    .entry{padding:12px 16px}
    .bm{right:12px;top:10px}

    /* Reader: full-screen overlay, below the back bar */
    .right{position:fixed;top:50px;left:0;right:0;bottom:0;z-index:100;height:auto;
      transform:translateX(100%);transition:transform .3s ease}
    .right.open{transform:translateX(0)}
    .reader-bar{display:none}

    /* Mobile back bar: fixed top, only visible when reader is open */
    .mob-back{
      display:none;position:fixed;top:0;left:0;right:0;z-index:200;
      height:50px;padding:0 16px;

  { cat:"情報設計", num:"10", date:"2026-10-25", title:"情報デザインと図解：構造を見せる", sub:"地下鉄の路線図は、地図であることをやめて読みやすくなった", url:"./information-architecture/10-information-design/" },
  { cat:"情報設計", num:"11", date:"2026-10-25", title:"リサーチ・評価・成果物：IAの実践プロセス", sub:"最初の一歩を正しく選んだ人は、6倍成功しやすかった", url:"./information-architecture/11-research-deliverables/" },
  { cat:"情報設計", num:"12", date:"2026-10-25", title:"拡張する情報空間：クロスチャネル・コンテンツ・AI・倫理", sub:"AI の要約が出ると、リンクを押す人は半分になった", url:"./information-architecture/12-expanding-space/" }
];

/* ---- flags (localStorage) ---- */
const LS_KEY = 'ra_flags';
let flags = {};
try { flags = JSON.parse(localStorage.getItem(LS_KEY)) || {}; } catch(e){}
function saveFlags(){ localStorage.setItem(LS_KEY, JSON.stringify(flags)); }
function isFlagged(url){ return !!flags[url]; }
function toggleFlag(url){ if(flags[url]) delete flags[url]; else flags[url]=1; saveFlags(); }

let active = 'all', keyword = '', currentUrl = null;

const listEl=document.getElementById('list'), filtersEl=document.getElementById('filters'),
  countEl=document.getElementById('count'), emptyEl=document.getElementById('empty'),
  qEl=document.getElementById('q'), readerEl=document.getElementById('reader'),
  readerTitle=document.getElementById('readerTitle'), readerLink=document.getElementById('readerLink'),
  readerEmpty=document.getElementById('readerEmpty'),
  mobBack=document.getElementById('mobBack'), mobBackBtn=document.getElementById('mobBackBtn'),
  mobBackTitle=document.getElementById('mobBackTitle'), mobBackLink=document.getElementById('mobBackLink');

function esc(s){return s.replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));}
function hl(t){
  if(!keyword) return esc(t);
  const i=t.toLowerCase().indexOf(keyword.toLowerCase());
  if(i<0) return esc(t);
  return esc(t.slice(0,i))+'<mark>'+esc(t.slice(i,i+keyword.length))+'</mark>'+esc(t.slice(i+keyword.length));
}

/* bookmark SVGs */
const bmOff='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 012-2h10a2 2 0 012 2z"/></svg>';
const bmOn='<svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 012-2h10a2 2 0 012 2z"/></svg>';

const cats=[...new Set(ARTICLES.map(a=>a.cat))];
const catCount=c=>ARTICLES.filter(a=>a.cat===c).length;
const flagCount=()=>ARTICLES.filter(a=>isFlagged(a.url)).length;

function matches(a){
  if(active==='flagged') return isFlagged(a.url)&&(!keyword||(a.title+a.sub+a.cat).toLowerCase().includes(keyword.toLowerCase()));
  const inCat=(active==='all'||a.cat===active);
  if(!inCat) return false;
  if(!keyword) return true;
  return (a.title+a.sub+a.cat).toLowerCase().includes(keyword.toLowerCase());
}

function render(){
  /* chips */
  let ch='<button class="chip '+(active==='all'?'active':'')+'" data-cat="all">すべて<span class="c">'+ARTICLES.length+'</span></button>';
  const fc=flagCount();
  ch+='<button class="chip flag-chip '+(active==='flagged'?'active':'')+'" data-cat="flagged">読みたい'+(fc?'<span class="c">'+fc+'</span>':'')+'</button>';
  cats.forEach(c=>{ch+='<button class="chip '+(active===c?'active':'')+'" data-cat="'+c+'">'+c+'<span class="c">'+catCount(c)+'</span></button>';});
  filtersEl.innerHTML=ch;
  filtersEl.querySelectorAll('.chip').forEach(b=>{b.addEventListener('click',()=>{active=b.dataset.cat;render();});});

  /* list */
  const shown=ARTICLES.filter(matches);
  listEl.innerHTML=shown.map((a,i)=>{
    const f=isFlagged(a.url), act=a.url===currentUrl;
    return '<div class="entry fade'+(act?' is-active':'')+'" style="animation-delay:'+Math.min(i*30,250)+'ms" data-url="'+esc(a.url)+'">'
      +'<button class="bm'+(f?' on':'')+'" data-bm="'+esc(a.url)+'" title="'+(f?'解除':'読みたい')+'" aria-label="ブックマーク">'+(f?bmOn:bmOff)+'</button>'
      +'<div class="cat">'+esc(a.cat)+'</div>'
      +'<div class="t">'+hl(a.title)+'</div>'
      +'<div class="s">'+hl(a.sub)+'</div>'
      +'</div>';
  }).join('');

  listEl.querySelectorAll('.bm').forEach(b=>{b.addEventListener('click',e=>{
    e.stopPropagation();
    const url=b.dataset.bm;
    toggleFlag(url);
    if(active==='flagged'){render();return;}
    /* in-place update: just swap icon + class, no full re-render */
    const now=isFlagged(url);
    b.classList.toggle('on',now);
    b.innerHTML=now?bmOn:bmOff;
    b.title=now?'解除':'読みたい';
    /* update chip count */
    const fc=flagCount();
    const fchip=filtersEl.querySelector('.flag-chip');
    if(fchip){const sp=fchip.querySelector('.c');if(fc){if(sp)sp.textContent=fc;else fchip.insertAdjacentHTML('beforeend','<span class="c">'+fc+'</span>');}else if(sp)sp.remove();}
  });});
  listEl.querySelectorAll('.entry').forEach(el=>{el.addEventListener('click',e=>{if(e.target.closest('.bm'))return;openArticle(el.dataset.url);});});

  countEl.textContent=keyword?'「'+keyword+'」 — '+shown.length+' 件'
    :(active==='all'?'全 '+shown.length+' 篇':active==='flagged'?'読みたい — '+shown.length+' 篇':active+' — '+shown.length+' 篇');
  emptyEl.style.display=shown.length===0?'block':'none';
}

function openArticle(url){
  currentUrl=url;
  const art=ARTICLES.find(a=>a.url===url);
  const title=art?art.title:'';

  const old=document.querySelector('.reader-frame');
  if(old) old.remove();
  readerEmpty.style.display='none';

  const iframe=document.createElement('iframe');
  iframe.className='reader-frame';
  iframe.src=url;
  iframe.setAttribute('loading','lazy');
  readerEl.appendChild(iframe);

  readerTitle.textContent=title;
  readerLink.href=url;

  /* mobile */
  readerEl.classList.add('open');
  mobBack.classList.add('show');
  mobBackTitle.textContent=title;
  mobBackLink.href=url;

  render();
}

function closeReader(){
  currentUrl=null;
  const old=document.querySelector('.reader-frame');
  if(old) old.remove();
  readerEmpty.style.display='';
  readerTitle.textContent='';
  readerEl.classList.remove('open');
  mobBack.classList.remove('show');
  render();
}

mobBackBtn.addEventListener('click',closeReader);
qEl.addEventListener('input',()=>{keyword=qEl.value.trim();render();});
render();
document.getElementById('luCount').textContent = ARTICLES.length;
</script>
<script>
/* THEMES:JS:START */
/* =========================================================
   DESIGN THEMES — 共有スクリプト（正本）
   このファイルを直接編集し、sync-themes.py で各ページに流し込む。
   ページ側は <div data-theme-switch></div> を1つ置くだけでよい。
   ページ固有の後処理が要る場合は window.onThemeChange に関数を入れる。
   ========================================================= */

var THEMES = [
  { id: 'sai',  name: 'SAI v2',      desc: 'モノクロ基調・エディトリアル', dots: ['#62B8A0', '#EB6584', '#F2C94C'] },
  { id: 'bold', name: 'Bold Yellow', desc: '黒と黄・2pxの枠線・影なし',    dots: ['#1B1B1B', '#E3E143', '#FAF9EC'] }
];

var THEME_KEY = 'design-theme';
var THEME_ICON =
  '<svg viewBox="0 0 24 24" aria-hidden="true">' +
  '<path d="M12 22a1 1 0 0 1 0-20 10 9 0 0 1 10 9 5 5 0 0 1-5 5h-2.25a1.75 1.75 0 0 0-1.4 2.8l.3.4a1.75 1.75 0 0 1-1.4 2.8z"/>' +
  '<circle data-dot cx="13.5" cy="6.5" r="1.5"/><circle data-dot cx="17.5" cy="10.5" r="1.5"/>' +
  '<circle data-dot cx="6.5" cy="12.5" r="1.5"/><circle data-dot cx="8.5" cy="7.5" r="1.5"/></svg>';

var activeTheme = THEMES[0].id;

function themeDotsHTML(theme) {
  return theme.dots.map(function (c) { return '<i style="background:' + c + '"></i>'; }).join('');
}

function applyTheme(id, persist) {
  var theme = THEMES.filter(function (t) { return t.id === id; })[0] || THEMES[0];
  activeTheme = theme.id;
  if (theme.id === THEMES[0].id) {
    document.documentElement.removeAttribute('data-theme');
  } else {
    document.documentElement.setAttribute('data-theme', theme.id);
  }
  if (persist) { try { localStorage.setItem(THEME_KEY, theme.id); } catch (e) {} }
  renderThemeSwitch();
  if (typeof window.onThemeChange === 'function') window.onThemeChange(theme.id);
}

function renderThemeSwitch() {
  var mount = document.querySelector('[data-theme-switch]');
  if (!mount) return;
  var theme = THEMES.filter(function (t) { return t.id === activeTheme; })[0] || THEMES[0];

  if (!mount.querySelector('.ts-btn')) {
    mount.innerHTML =
      '<button type="button" class="ts-btn" aria-haspopup="listbox" aria-expanded="false">' + THEME_ICON + '</button>' +
      '<div class="ts-menu" role="listbox" aria-label="デザイン" hidden></div>';
    mount.querySelector('.ts-btn').addEventListener('click', function (e) {
      e.stopPropagation();
      var menu = mount.querySelector('.ts-menu');
      menu.hidden ? openThemeMenu() : closeThemeMenu();
    });
  }

  var btn = mount.querySelector('.ts-btn');
  btn.setAttribute('aria-label', 'デザインを切り替える（現在: ' + theme.name + '）');
  btn.setAttribute('title', 'デザイン: ' + theme.name);

  var menu = mount.querySelector('.ts-menu');
  menu.innerHTML = '';
  THEMES.forEach(function (t) {
    var opt = document.createElement('button');
    opt.type = 'button';
    opt.className = 'ts-opt';
    opt.setAttribute('role', 'option');
    opt.setAttribute('aria-selected', String(t.id === activeTheme));
    opt.innerHTML =
      '<span class="ts-dots">' + themeDotsHTML(t) + '</span>' +
      '<span class="ts-text"><span class="ts-name">' + t.name + '</span>' +
      '<span class="ts-desc">' + t.desc + '</span></span>' +
      '<span class="ts-check">●</span>';
    opt.addEventListener('click', function () { applyTheme(t.id, true); closeThemeMenu(); });
    menu.appendChild(opt);
  });
}

function openThemeMenu() {
  var mount = document.querySelector('[data-theme-switch]');
  if (!mount) return;
  mount.querySelector('.ts-menu').hidden = false;
  mount.querySelector('.ts-btn').setAttribute('aria-expanded', 'true');
}

function closeThemeMenu() {
  var mount = document.querySelector('[data-theme-switch]');
  if (!mount) return;
  mount.querySelector('.ts-menu').hidden = true;
  mount.querySelector('.ts-btn').setAttribute('aria-expanded', 'false');
}

function initThemeSwitch() {
  var saved = null;
  try { saved = localStorage.getItem(THEME_KEY); } catch (e) {}
  applyTheme(saved || THEMES[0].id, false);

  document.addEventListener('click', function (e) {
    var mount = document.querySelector('[data-theme-switch]');
    if (mount && !mount.contains(e.target)) closeThemeMenu();
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeThemeMenu(); });
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', initThemeSwitch);
} else {
  initThemeSwitch();
}
/* THEMES:JS:END */
</script>
